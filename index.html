<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descobre os vales | VouchersLu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Playfair+Display:ital,wght@0,500..700;1,500..700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #fdf9fa;
      --bg-hero: #f7e8ec;
      --bg-card: #ffffff;
      --bg-tint: #f9eff2;
      --text-main: #231f20;
      --text-muted: #6e6467;
      --accent: #c5768b;
      --accent-dark: #a85b70;
      --success: #4a7c59;
      --error: #b84a5b;
      --border: #efe2e6;
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .site-header {
      border-bottom: 1px solid var(--border);
      background: var(--bg-page);
    }

    .header-inner,
    .site-main,
    .site-footer {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    .header-inner {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 600;
    }

    .brand-mark {
      color: var(--accent);
    }

    .header-tagline {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Main Content */
    .site-main {
      flex: 1;
      padding-top: 32px;
      padding-bottom: 64px;
    }

    .eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .eyebrow-mark {
      color: var(--accent);
    }

    /* Hero Banner with Concentric Circles */
    .welcome {
      background: var(--bg-hero);
      border-radius: 28px;
      padding: 64px 56px;
      margin-bottom: 48px;
      position: relative;
      overflow: hidden;
    }

    .welcome::before,
    .welcome::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(197, 118, 139, 0.14);
      pointer-events: none;
    }

    .welcome::before {
      width: 440px;
      height: 440px;
      top: -120px;
      right: -60px;
    }

    .welcome::after {
      width: 320px;
      height: 320px;
      top: -60px;
      right: 0px;
    }

    .welcome h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 4.5vw, 3.6rem);
      font-weight: 600;
      line-height: 1.12;
      margin: 18px 0 22px;
      max-width: 680px;
      position: relative;
      z-index: 1;
    }

    .welcome h1 span {
      color: var(--accent);
      font-style: italic;
    }

    .welcome-copy {
      max-width: 580px;
      color: var(--text-muted);
      font-size: 1.02rem;
      position: relative;
      z-index: 1;
    }

    /* List Heading */
    .list-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
    }

    .list-heading h2 {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .voucher-count {
      background: var(--accent);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 700;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .list-note {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Voucher Grid */
    .voucher-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .voucher-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .voucher-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(35, 31, 32, 0.06);
    }

    .voucher-image-link {
      position: relative;
      display: block;
      height: 260px;
      background: #fff;
      overflow: hidden;
    }

    .voucher-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 12px;
      transition: filter 0.3s ease, opacity 0.3s ease;
    }

    /* Redeemed Card State */
    .voucher-card.is-redeemed .voucher-image {
      filter: grayscale(85%) opacity(0.65);
    }

    .voucher-card.is-redeemed .offer-tag {
      background: #eef5f0;
      border-color: #cde0d3;
      color: var(--success);
    }

    .offer-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .image-arrow {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-page);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .voucher-card-body {
      padding: 18px 24px 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .meta-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .voucher-card-body h3 {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .voucher-card-body p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      flex: 1;
    }

    .card-cta {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .voucher-card.is-redeemed .card-cta {
      color: var(--success);
    }

    .home-note {
      text-align: center;
      margin-top: 48px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .home-note span {
      color: var(--accent);
    }

    /* Detail Page */
    .detail-back {
      display: inline-block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .detail-back:hover {
      color: var(--accent);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
    }

    .detail-artwork {
      position: relative;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 440px;
    }

    .detail-artwork img {
      max-width: 100%;
      max-height: 380px;
      object-fit: contain;
      transition: filter 0.3s ease, opacity 0.3s ease;
    }

    .detail-artwork.is-redeemed img {
      filter: grayscale(85%) opacity(0.7);
    }

    .detail-copy h1 {
      font-family: var(--font-serif);
      font-size: 2.6rem;
      font-weight: 600;
      margin: 10px 0 16px;
      line-height: 1.15;
    }

    .detail-description {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .includes h2 {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .includes ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .includes li {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .check-mark {
      color: var(--accent);
      font-weight: 700;
    }

    .validity {
      background: var(--bg-tint);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .validity-icon {
      color: var(--accent);
      font-size: 1.25rem;
    }

    .validity strong {
      display: block;
      font-size: 0.85rem;
    }

    .validity span {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .claim-button {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s ease;
    }

    .claim-button:hover {
      background: var(--accent-dark);
    }

    .claim-button.claimed {
      background: var(--success);
      justify-content: center;
      cursor: default;
    }

    /* Password Unlock Box */
    .password-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-top: 14px;
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.2s ease;
    }

    .password-box.is-open {
      display: flex;
    }

    .password-box label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .password-input-row {
      display: flex;
      gap: 10px;
    }

    .password-input-row input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 0.92rem;
      color: var(--text-main);
      background: var(--bg-page);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .password-input-row input:focus {
      border-color: var(--accent);
    }

    .password-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .password-submit:hover {
      background: var(--accent-dark);
    }

    .feedback-message {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.5;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .feedback-message.is-error {
      display: block;
      background: #fdf0f2;
      border: 1px solid #f2ccd2;
      color: var(--error);
    }

    .feedback-message.is-success {
      display: block;
      background: #eef6f0;
      border: 1px solid #c6e0cd;
      color: var(--success);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fine-print {
      margin-top: 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--border);
      padding-top: 24px;
      padding-bottom: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .welcome {
        padding: 36px 24px;
      }

      .voucher-grid,
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .password-input-row {
        flex-direction: column;
      }

      .password-submit {
        padding: 12px;
      }

      .site-footer {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
    }
  </style>
</head>

    const STORAGE_KEY = "voucherslu_redeemed";
    const appContent = document.getElementById("app-content");

    function getRedeemedIds() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function isRedeemed(id) {
      return getRedeemedIds().includes(id);
    }

    function markAsRedeemed(id) {
      const redeemed = getRedeemedIds();
      if (!redeemed.includes(id)) {
        redeemed.push(id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(redeemed));
      }
    }

    function renderHome() {
      document.title = "Descobre os vales | VouchersLu";
      const count = String(vouchers.length).padStart(2, "0");

      const cardsHtml = vouchers.map(v => {
        const redeemed = isRedeemed(v.id);
        return `
          <article class="voucher-card ${redeemed ? "is-redeemed" : ""}">
            <a class="voucher-image-link" href="#/vouchers/${v.id}" aria-label="Ver vale: ${v.title}">
              <img class="voucher-image" src="${v.imageUrl}" alt="${v.imageAlt}" />
              <span class="offer-tag">${redeemed ? "✓ Voucher Resgatado" : v.offerLabel}</span>
              <span class="image-arrow" aria-hidden="true">↗</span>
            </a>
            <div class="voucher-card-body">
              <div class="card-meta">
                <span>${v.category}</span>
                ${v.neighborhood ? `<span class="meta-dot" aria-hidden="true"></span><span>${v.neighborhood}</span>` : ""}
              </div>
              <h3><a href="#/vouchers/${v.id}">${v.title}</a></h3>
              <p>${v.shortDescription}</p>
              <a class="card-cta" href="#/vouchers/${v.id}">
                ${redeemed ? "Voucher já resgatado ❤️" : 'Explorar vale <span aria-hidden="true">→</span>'}
              </a>
            </div>
          </article>
        `;
      }).join("");

      appContent.innerHTML = `
        <section class="voucher-home">
          <div class="welcome">
            <p class="eyebrow"><span class="eyebrow-mark" aria-hidden="true">✳</span> PEQUENOS MOMENTOS, GRANDES MEMÓRIAS</p>
            <h1>Um novo capítulo<br />cheio de <span>pequenas aventuras nossas</span></h1>
            <p class="welcome-copy">Várias possibilidades para começarmos a nossa vida em Varsóvia, criarmos novas rotinas e colecionarmos momentos especiais. Escolhe um vale e vamos tornar esta nova aventura ainda mais nossa.</p>
          </div>

          <div class="list-heading">
            <div>
              <p class="eyebrow">O NOSSO LIVRINHO</p>
              <h2>Vales disponíveis <span class="voucher-count">${count}</span></h2>
            </div>
            <p class="list-note">Pequenos grandes momentos para nós.</p>
          </div>

          <div class="voucher-grid">${cardsHtml}</div>

          <p class="home-note"><span aria-hidden="true">✳</span> As coisas boas sabem ainda melhor quando partilhadas.</p>
        </section>
      `;
    }

    function renderDetail(id, justUnlocked = false) {
      const v = vouchers.find(item => item.id === id);
      if (!v) {
        renderHome();
        return;
      }

      const redeemed = isRedeemed(v.id);
      document.title = `${v.title} | VouchersLu`;

      const perksHtml = v.perks.map(p => `
        <li><span class="check-mark" aria-hidden="true">✓</span> ${p}</li>
      `).join("");

      appContent.innerHTML = `
        <article class="voucher-detail">
          <a class="detail-back" href="#/">← All vouchers</a>
          <div class="detail-grid">
            <div class="detail-artwork ${redeemed ? "is-redeemed" : ""}">
              <img src="${v.imageUrl}" alt="${v.imageAlt}" />
              <span class="offer-tag">${v.offerLabel}</span>
            </div>
            <div class="detail-copy">
              <p class="eyebrow">
                ${v.category}
                ${v.neighborhood ? `<span class="meta-dot" aria-hidden="true"></span>${v.neighborhood}` : ""}
              </p>
              <h1>${v.title}</h1>
              <p class="detail-description">${v.detail}</p>
              <div class="includes">
                <h2>Um pouco mais sobre o vale</h2>
                <ul>${perksHtml}</ul>
              </div>
              <div class="validity">
                <span class="validity-icon" aria-hidden="true">◷</span>
                <div><strong>Quando resgatar</strong><span>${v.validity}</span></div>
              </div>

              ${redeemed ? `
                <button class="claim-button claimed" type="button" disabled>
                  Voucher Resgatado! ❤️
                </button>
              ` : `
                <button class="claim-button" id="claim-trigger" type="button" onclick="openPasswordBox()">
                  Resgatar Voucher <span aria-hidden="true">→</span>
                </button>
                <div class="password-box" id="password-box">
                  <label for="voucher-code-input">Introduz o código do teu vale para o resgatares</label>
                  <div class="password-input-row">
                    <input type="text" id="voucher-code-input" placeholder="Código secreto..." autocomplete="off" onkeydown="if(event.key==='Enter') verifyPassword('${v.id}')" />
                    <button class="password-submit" type="button" onclick="verifyPassword('${v.id}')">Confirmar</button>
                  </div>
                </div>
              `}

              <div id="feedback-box" class="feedback-message ${justUnlocked ? "is-success" : ""}">
                ${justUnlocked ? "Parabéns! Voucher desbloqueado com sucesso! Resgata a tua surpresa quando quiseres. ❤️" : ""}
              </div>

              ${v.finePrint ? `<p class="fine-print">${v.finePrint}</p>` : ""}
            </div>
          </div>
        </article>
      `;
    }

    function openPasswordBox() {
      const box = document.getElementById("password-box");
      const feedback = document.getElementById("feedback-box");
      if (feedback) {
        feedback.className = "feedback-message";
        feedback.textContent = "";
      }
      if (box) {
        box.classList.add("is-open");
        const input = document.getElementById("voucher-code-input");
        if (input) input.focus();
      }
    }

    function verifyPassword(id) {
      const v = vouchers.find(item => item.id === id);
      const input = document.getElementById("voucher-code-input");
      const box = document.getElementById("password-box");
      const feedback = document.getElementById("feedback-box");
      if (!v || !input) return;

      const entered = input.value.trim().toLowerCase();

      if (entered === v.password.toLowerCase()) {
        markAsRedeemed(id);
        renderDetail(id, true);
      } else {
        box.classList.remove("is-open");
        input.value = "";
        feedback.textContent = "Ups! Não é desta que desbloqueias o teu voucher. Tenta novamente!";
        feedback.className = "feedback-message is-error";
      }
    }

    function router() {
      const hash = window.location.hash;
      if (hash.startsWith("#/vouchers/")) {
        const id = hash.replace("#/vouchers/", "");
        renderDetail(id);
      } else {
        renderHome();
      }
      window.scrollTo(0, 0);
    }

    window.addEventListener("hashchange", router);
    window.addEventListener("DOMContentLoaded", router);
  </script>
</body>
</html>
